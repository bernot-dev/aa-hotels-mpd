<!DOCTYPE html>
<html>
<head>
  <title>AA Hotels MPD Options</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
      line-height: 1.6;
      max-width: 480px;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 16px;
    }
    label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      cursor: pointer;
    }
    button {
      padding: 8px 16px;
      cursor: pointer;
      font-weight: 500;
      margin-top: 8px;
    }
    #status {
      margin-top: 10px;
      color: green;
      font-size: 14px;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <h1>AA Hotels MPD Settings</h1>
  <label>
    <input type="checkbox" id="expandRoomRates">
    Expand Room Rates
  </label>
  <label>
    <input type="checkbox" id="expandRoomTypes">
    Expand Room Types
  </label>
  <label>
    <input type="checkbox" id="expandSearchResults">
    Expand All Search Results
  </label>
  <label>
    <input type="checkbox" id="includeBonusMiles">
    Include Bonus Miles Offers
  </label>
  <label>
    <input type="checkbox" id="showDebugButton">
    Show DOM Fixture Export Button
  </label>
  <button id="save">Save Settings</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
